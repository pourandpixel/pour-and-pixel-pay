<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose your package | Pour &amp; Pixel</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 420'%3E%3Crect x='20' y='20' width='380' height='380' rx='60' fill='%231F3A5F'/%3E%3Cpath d='M210 70C178 118 122 172 122 236a88 88 0 0 0 176 0c0-64-56-118-88-166z' fill='%23F4EBDD'/%3E%3Crect x='178' y='214' width='64' height='64' rx='8' fill='%232A9D8F'/%3E%3C/svg%3E">
<script>
/* =====================================================================
   YOUR PACKAGES - this is the only part you need to edit.
   For each package paste in its price and the two Stripe payment links:
     linkWithCare    = the package + the £25/month Care Plan
     linkWithoutCare = the package on its own
   The marketing package already includes the Care Plan, so it has ONE link:
     link            = Website + Branding + Marketing AND the £199/month package
   ===================================================================== */
const PACKAGES = [
  { id: "website",   name: "Website",
    price: "£595", launch: true, blurb: "A complete, professional website, built for you and ready to go live.",
    linkWithCare: "https://buy.stripe.com/eVqeVeafD5Lm1Rm4yz73G07", linkWithoutCare: "https://buy.stripe.com/00w9AUcnL0r22Vq0ij73G06" },
  { id: "branding",  name: "Website + Branding",
    price: "£995", blurb: "Your website plus a logo and brand look to match.",
    linkWithCare: "https://buy.stripe.com/9B6cN6gE12zabrW5CD73G0a", linkWithoutCare: "https://buy.stripe.com/4gM00k73rb5G2Vq8OP73G08" },
  { id: "marketing", name: "Website + Branding + Marketing",
    price: "£995 + £199/month", careIncluded: true,
    blurb: "Everything above, plus we run your online advertising. Includes ad management and the Care Plan for £199/month.",
    link: "https://buy.stripe.com/3cI8wQcnL1v6dA44yz73G0b" },
];
const CARE_PLAN = { name: "Care Plan", price: "£25/month",
  blurb: "Optional monthly membership, paid automatically each month." };
const CONTACT_EMAIL = "hello@pourandpixel.co.uk";

/* LAUNCH OFFER - shown as a banner at the top. After your 100th customer, change
   SHOW_LAUNCH_OFFER to false (and update the prices above). */
const SHOW_LAUNCH_OFFER = true;
const LAUNCH_TITLE = "Launch price: £595 for a complete website";
const LAUNCH_TEXT  = "UK web design agencies typically charge £1,500 to £5,000. Our launch price is only available to our first 100 customers.";
</script>
<style>
:root{--navy:#1F3A5F;--teal:#2A9D8F;--teal-strong:#1E7A6F;--surface:#FBF8F3;--sand:#F4EBDD;--tint:#CFE6E2;--ink:#14263D;--muted:#5B6878;--line:#E2D8C7}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.55 "Inter",system-ui,-apple-system,sans-serif}
h1,h2{font-family:"Fraunces",Georgia,serif;font-weight:600;color:var(--navy);margin:0}
header{background:var(--navy)}
header .in{max-width:880px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:12px}
header span{font:600 22px "Fraunces",Georgia,serif;color:var(--sand)}
main{max-width:880px;margin:0 auto;padding:36px 20px 60px}
.lead{color:var(--muted);margin:8px 0 28px;font-size:17px}
.step{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-strong);margin:0 0 10px}
fieldset{border:0;padding:0;margin:0 0 28px}
legend{padding:0}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:18px;cursor:pointer}
.opt:hover{border-color:var(--teal)}
.opt input{margin-top:4px;width:20px;height:20px;accent-color:var(--teal-strong);flex:none}
.opt.on{border-color:var(--teal-strong);background:#F6FBFA}
.opt .t{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%}
.opt b{font-size:18px;color:var(--navy)}.opt .p{font-weight:600;color:var(--navy);white-space:nowrap}
.opt small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--tint);color:var(--navy);padding:2px 8px;border-radius:999px;vertical-align:middle}
.sum{background:var(--sand);border-radius:12px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.sum p{margin:0}.sum .tot{font:600 20px "Fraunces",Georgia,serif;color:var(--navy)}
button{font:inherit;font-weight:600;font-size:17px;background:var(--teal-strong);color:#fff;border:0;border-radius:12px;padding:14px 26px;min-height:48px;cursor:pointer}
button:hover{background:var(--navy)}button:disabled{opacity:.5;cursor:default}
.note{color:var(--muted);font-size:14px;margin-top:16px}
.err{color:#A6402C;font-weight:600;margin-top:12px}
a{color:var(--teal-strong)}
.launch{background:var(--navy);color:var(--sand);border-radius:12px;padding:18px 20px;margin:0 0 28px;display:flex;flex-direction:column;gap:4px}
.launch .lt{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#7FD3C6}
.launch b{font:600 22px "Fraunces",Georgia,serif;color:#fff}
.tag.offer{background:var(--navy);color:var(--sand)}
</style>
</head>
<body>
<header><div class="in">
 <svg viewBox="0 0 420 420" width="36" height="36" aria-hidden="true"><rect x="20" y="20" width="380" height="380" rx="60" fill="#2C4E78"/><path d="M210 70C178 118 122 172 122 236a88 88 0 0 0 176 0c0-64-56-118-88-166z" fill="#F4EBDD"/><rect x="178" y="214" width="64" height="64" rx="8" fill="#2A9D8F"/><rect x="314" y="300" width="24" height="24" rx="6" fill="#2A9D8F"/><rect x="346" y="332" width="24" height="24" rx="6" fill="#CFE6E2"/></svg>
 <span>Pour &amp; Pixel</span>
</div></header>
<main>
 <h1 id="title">Choose your package</h1>
 <p class="lead" id="lead">Pick your package, add the Care Plan if you'd like it, then pay securely with Stripe.</p>
 <div class="launch" id="launch" hidden><span class="lt">Launch offer</span><b id="ltitle"></b><span id="ltext"></span></div>

 <fieldset>
  <legend class="step">Step 1 &middot; Your package</legend>
  <div class="opts" id="packages"></div>
 </fieldset>

 <fieldset>
  <legend class="step" id="carestep">Step 2 &middot; Add the Care Plan? (optional)</legend>
  <div class="opts" id="care"></div>
 </fieldset>

 <div class="sum">
  <div><p id="sumline">Choose a package above</p><p class="tot" id="total"></p></div>
  <button id="go" disabled>Continue to secure payment</button>
 </div>
 <p class="err" id="err" hidden></p>
 <p class="note">Payments are handled by Stripe. Questions? Email <a id="mail"></a> and we'll help.</p>
</main>
<script>
const qs = new URLSearchParams(location.search);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let pkg = PACKAGES.find(p => p.id === qs.get("package")) ? qs.get("package") : null;
let care = qs.get("care") === "no" ? false : (qs.get("care") === "yes" ? true : null);

const biz = qs.get("business");
if (biz) {
  document.getElementById("title").textContent = "Lock in your website, " + biz;
  document.title = biz + " | Choose your package | Pour & Pixel";
}
if (SHOW_LAUNCH_OFFER) {
  document.getElementById("launch").hidden = false;
  document.getElementById("ltitle").textContent = LAUNCH_TITLE;
  document.getElementById("ltext").textContent = LAUNCH_TEXT;
}
document.getElementById("mail").textContent = CONTACT_EMAIL;
document.getElementById("mail").href = "mailto:" + CONTACT_EMAIL;

function draw() {
  const sel = PACKAGES.find(x => x.id === pkg);
  const incl = !!(sel && sel.careIncluded);
  document.getElementById("carestep").parentElement.hidden = incl;
  document.getElementById("packages").innerHTML = PACKAGES.map(p => `
    <label class="opt ${pkg === p.id ? "on" : ""}">
      <input type="radio" name="pkg" value="${p.id}" ${pkg === p.id ? "checked" : ""}>
      <span style="width:100%"><span class="t"><b>${esc(p.name)}${qs.get("package") === p.id ? '<span class="tag">You chose this</span>' : ""}${p.launch && SHOW_LAUNCH_OFFER ? '<span class="tag offer">Launch price &middot; first 100 customers</span>' : ""}</b>
      <span class="p">${esc(p.price)}</span></span><small>${esc(p.blurb)}</small></span>
    </label>`).join("");
  document.getElementById("care").innerHTML = `
    <label class="opt ${care === true ? "on" : ""}"><input type="radio" name="care" value="yes" ${care === true ? "checked" : ""}>
      <span style="width:100%"><span class="t"><b>Yes, add the ${esc(CARE_PLAN.name)}</b><span class="p">${esc(CARE_PLAN.price)}</span></span>
      <small>${esc(CARE_PLAN.blurb)}</small></span></label>
    <label class="opt ${care === false ? "on" : ""}"><input type="radio" name="care" value="no" ${care === false ? "checked" : ""}>
      <span style="width:100%"><span class="t"><b>No thanks, just the package</b><span class="p"></span></span></span></label>`;
  document.querySelectorAll('input[name=pkg]').forEach(i => i.onchange = () => { pkg = i.value; draw(); });
  document.querySelectorAll('input[name=care]').forEach(i => i.onchange = () => { care = i.value === "yes"; draw(); });
  const p = sel;
  if (incl) {
    document.getElementById("sumline").textContent = p.name + " (Care Plan included)";
    document.getElementById("total").textContent = p.price;
    document.getElementById("go").disabled = false;
    return;
  }
  document.getElementById("sumline").textContent = p ? p.name + (care ? " + " + CARE_PLAN.name : care === false ? " (no Care Plan)" : "") : "Choose a package above";
  document.getElementById("total").textContent = p ? p.price + (care ? " today, then " + CARE_PLAN.price : "") : "";
  document.getElementById("go").disabled = !(p && care !== null);
}

document.getElementById("go").onclick = () => {
  const p = PACKAGES.find(x => x.id === pkg);
  let link = p.careIncluded ? p.link : (care ? p.linkWithCare : p.linkWithoutCare);
  const err = document.getElementById("err");
  if (!/^https:\/\/(buy|checkout)\.stripe\.com\//.test(link)) {
    err.hidden = false;
    err.textContent = "Sorry, this payment option isn't set up yet. Please email " + CONTACT_EMAIL + " and we'll sort it out.";
    return;
  }
  const u = new URL(link);
  if (qs.get("email")) u.searchParams.set("prefilled_email", qs.get("email"));   // saves them typing it
  if (qs.get("ref")) u.searchParams.set("client_reference_id", qs.get("ref"));  // tells you which draft it was
  location.href = u.toString();
};
draw();
</script>
</body>
</html>
